name: Deploy to AWS Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build versioned Linux image
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t "viral-video-analyzer:$GITHUB_SHA" .

      - name: Test deployment guards
        run: |
          docker run --rm --entrypoint node -v "$PWD/tests:/app/tests:ro" -v "$PWD/deploy:/app/deploy:ro" -v "$PWD/docker-compose.yml:/app/docker-compose.yml:ro" -v "$PWD/.github:/app/.github:ro" -v "$PWD/Dockerfile:/app/Dockerfile:ro" -v "$PWD/.dockerignore:/app/.dockerignore:ro" "viral-video-analyzer:$GITHUB_SHA" --test tests/deployment-config.test.mjs tests/openai-deploy-config.test.mjs

      - name: Test hand-card video regression without provider credentials
        run: |
          docker run --rm --entrypoint node -v "$PWD/tests:/app/tests:ro" "viral-video-analyzer:$GITHUB_SHA" --test --test-concurrency=2 tests/qwen-full-video-input.test.mjs tests/qwen-transport.test.mjs tests/qwen-diagnostics-safety.test.mjs tests/analysis-qwen-local-retry.test.mjs tests/product-doc-sync-write-protection.test.mjs tests/video-queue-hard-timeout.test.mjs tests/transcript-validation.test.mjs tests/product-doc-analysis.test.mjs tests/feishu-parser-duplicates.test.mjs tests/video-processing-av-integrity.test.mjs tests/tiktok-video-download.test.mjs tests/feishu-delivery-guard.test.mjs

      - name: Test PID catalog and hand-card writes offline
        run: |
          docker run --rm --network none --entrypoint node -v "$PWD/tests:/app/tests:ro" "viral-video-analyzer:$GITHUB_SHA" --test tests/provider-settings-ui.test.mjs tests/ai-settings.test.mjs tests/admin-auth.test.mjs tests/product-catalog-reorganize.test.mjs tests/product-catalog.test.mjs tests/product-catalog-button.test.mjs tests/product-card-manual-only.test.mjs tests/feishu-product-card-two-stage.test.mjs

      - name: Smoke test with an isolated empty MySQL
        run: bash deploy/smoke-test.sh "viral-video-analyzer:$GITHUB_SHA"

      - name: Prepare release bundle
        run: |
          release_dir="releases/$GITHUB_SHA"
          mkdir -p "$release_dir/deploy"
          docker save "viral-video-analyzer:$GITHUB_SHA" | gzip > "$release_dir/viral-video-analyzer.tar.gz"
          cp docker-compose.yml "$release_dir/docker-compose.yml"
          cp deploy/update-server.sh "$release_dir/deploy/update-server.sh"
          cd "$release_dir"
          sha256sum viral-video-analyzer.tar.gz docker-compose.yml deploy/update-server.sh > release.sha256

      - name: Upload immutable release bundle
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "releases/${{ github.sha }}"
          target: "/opt/viral-video-analyzer"
          overwrite: true

      - name: Preflight and update only the application
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            release_script="/opt/viral-video-analyzer/releases/${{ github.sha }}/deploy/update-server.sh"
            sudo bash "$release_script" --check '${{ github.sha }}'
            sudo bash "$release_script" --apply '${{ github.sha }}'
