name: Deploy to AWS Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Docker image on GitHub runner
        run: docker build -t viral-video-analyzer:latest .

      - name: Export Docker image
        run: docker save viral-video-analyzer:latest | gzip > viral-video-analyzer.tar.gz

      - name: Copy runtime configuration to AWS Lightsail
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "docker-compose.yml,deploy/nginx.conf"
          target: "/opt/viral-video-analyzer"
          overwrite: true

      - name: Copy built Docker image to AWS Lightsail
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "viral-video-analyzer.tar.gz"
          target: "/opt/viral-video-analyzer"
          overwrite: true

      - name: Deploy over SSH
        # Pin third-party code that receives deployment secrets to an immutable
        # commit instead of a movable tag.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          envs: OPENAI_API_KEY
          script: |
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi
            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker-compose-v2
            fi
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            fi
            cd /opt/viral-video-analyzer
            if [ -z "${OPENAI_API_KEY:-}" ]; then
              echo "OPENAI_API_KEY repository secret is missing" >&2
              exit 1
            fi
            # Persist the runtime key without printing it. This preserves the
            # existing server-side .env values and keeps manual container
            # restarts consistent with GitHub deployments.
            umask 077
            runtime_env_tmp=$(mktemp)
            trap 'rm -f "$runtime_env_tmp"' EXIT
            if [ -f .env ]; then
              sudo awk '!/^OPENAI_API_KEY=/' .env > "$runtime_env_tmp"
            fi
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> "$runtime_env_tmp"
            sudo install -m 600 "$runtime_env_tmp" .env
            rm -f "$runtime_env_tmp"
            trap - EXIT
            unset OPENAI_API_KEY
            sudo docker load -i /opt/viral-video-analyzer/viral-video-analyzer.tar.gz
            rm -f /opt/viral-video-analyzer/viral-video-analyzer.tar.gz
            # The container may have been created manually during recovery,
            # so remove it by its fixed name before Compose recreates it.
            # The named viral_data volume is not removed.
            sudo docker rm -f viral-video-analyzer 2>/dev/null || true
            sudo docker compose up -d --no-build --remove-orphans

            sudo install -m 644 deploy/nginx.conf /etc/nginx/sites-available/viral-video-analyzer
            sudo ln -sfn /etc/nginx/sites-available/viral-video-analyzer /etc/nginx/sites-enabled/viral-video-analyzer
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx

            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                sudo docker logs --tail 120 viral-video-analyzer
                exit 1
              fi
              sleep 2
            done
            sudo docker compose ps
            sudo docker image prune -f
