name: Deploy to Alibaba ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image on GitHub runner
        run: docker build -t viral-video-analyzer:latest .

      - name: Export Docker image
        run: docker save viral-video-analyzer:latest | gzip > viral-video-analyzer.tar.gz

      - name: Copy project to Alibaba ECS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/viral-video-analyzer"
          overwrite: true

      - name: Copy built Docker image to Alibaba ECS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "viral-video-analyzer.tar.gz"
          target: "/opt/viral-video-analyzer"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              apt-get update
              apt-get install -y docker.io
              systemctl enable --now docker
            fi
            if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
              apt-get update
              apt-get install -y docker-compose
            fi
            cd /opt/viral-video-analyzer
            docker load -i /opt/viral-video-analyzer/viral-video-analyzer.tar.gz
            rm -f /opt/viral-video-analyzer/viral-video-analyzer.tar.gz
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --no-build --remove-orphans
              docker compose ps
              test -n "$(docker compose ps -q viral-analyzer)"
            else
              docker-compose up -d --no-build --remove-orphans
              docker-compose ps
              test -n "$(docker-compose ps -q viral-analyzer)"
            fi
            docker image prune -f
